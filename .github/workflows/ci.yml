name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock=false
      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - name: Smoke test packed artifact
        run: |
          package_tarball="$(npm pack --silent)"
          mkdir package-smoke
          tar -xzf "$package_tarball" -C package-smoke
          npm --prefix package-smoke/package run smoke
